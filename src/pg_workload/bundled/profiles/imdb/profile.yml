api_version: pg_workload/v1
name: imdb
schema: imdb
description: Rich synthetic movie-domain workload with 21-table join and filter patterns.
requires_write: false
prepare:
  steps:
    - type: sql
      path: sql/imdb-schema.sql
    - type: generator
      path: generator.py
    - type: sql
      path: sql/imdb-fkindexes.sql
jobs:
  - name: analytical_selects
    type: pgbench
    interval: 60
    log: analytical_selects.log
    no_vacuum: true
    clients: 2
    threads: 2
    transactions: 5
    scripts_glob:
      - sql/[0-9][0-9]_*.sql
      - sql/select_*.sql
