api_version: pg_workload/v1
name: pagila
schema: pagila
description: Synthetic Pagila OLTP with a 50/25/20/5 read/insert/update/delete mix.
requires_write: true
prepare:
  steps:
    - type: generator
      path: generator.py
jobs:
  - name: main
    type: pgbench
    interval: 60
    log: main.log
    recover_on_failure: false
    no_vacuum: true
    clients: 2
    threads: 2
    transactions: 5
    scripts:
      - path: sql/01_select.sql
        weight: 50
      - path: sql/02_insert.sql
        weight: 25
      - path: sql/03_update.sql
        weight: 20
      - path: sql/04_delete.sql
        weight: 5
  - name: analyze_customer
    type: psql
    interval: 60
    log: analyze_customer.log
    command: "analyze pagila.customer;"
  - name: refresh_rental_by_category
    type: psql
    interval: 1800
    log: refresh_rental_by_category.log
    command: "REFRESH MATERIALIZED VIEW pagila.rental_by_category;"
